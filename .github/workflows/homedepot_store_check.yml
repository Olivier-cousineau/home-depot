name: Home Depot store offers check

on:
  workflow_dispatch:
    inputs:
      category_url:
        description: "HomeDepot.ca category URL"
        required: false
        default: ""
      max_stores:
        description: "Maximum stores to process"
        required: false
        default: "5"
      max_products:
        description: "Optional maximum products"
        required: false
        default: ""
      sleep_seconds:
        description: "Sleep between product checks"
        required: false
        default: "0.5"
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: write

jobs:
  build-and-check-store-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: Build product catalogue (optional)
        env:
          INPUT_CATEGORY_URL: ${{ github.event.inputs.category_url }}
        run: |
          if [ -n "${INPUT_CATEGORY_URL}" ]; then
            python scripts/build_homedepot_products_from_category.py \
              --category-url "${INPUT_CATEGORY_URL}" \
              --output data/homedepot_products.json
          else
            echo "No category_url provided, reusing existing data/homedepot_products.json"
          fi

      - name: Run store offer checker
        env:
          INPUT_MAX_STORES: ${{ github.event.inputs.max_stores }}
          INPUT_MAX_PRODUCTS: ${{ github.event.inputs.max_products }}
          INPUT_SLEEP: ${{ github.event.inputs.sleep_seconds }}
        run: |
          MAX_STORES="${INPUT_MAX_STORES:-5}"
          SLEEP_SECONDS="${INPUT_SLEEP:-0.5}"
          MAX_PRODUCTS_ARGS=""

          if [ -n "${INPUT_MAX_PRODUCTS}" ]; then
            MAX_PRODUCTS_ARGS="--max-skus ${INPUT_MAX_PRODUCTS}"
          fi

          python scripts/check_homedepot_store_offers.py \
            --stores data/home_depot_stores.json \
            --products data/homedepot_products.json \
            --max-stores "${MAX_STORES}" \
            --sleep "${SLEEP_SECONDS}" \
            ${MAX_PRODUCTS_ARGS}

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          if [ -n "$(git status --porcelain data/homedepot_products.json public/homedepot public/index/homedepot-deals.json)" ]; then
            git add data/homedepot_products.json public/homedepot public/index/homedepot-deals.json
            git commit -m "chore: refresh Home Depot products and store offers"
          else
            echo "No generated changes"
          fi

      - name: Push changes
        run: |
          if [ -n "$(git log --oneline origin/$(git branch --show-current)..HEAD)" ]; then
            git push
          else
            echo "No commits to push"
          fi
